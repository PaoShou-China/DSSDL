[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dssdl-research"
version = "0.2.0"
description = "Reproducible shared-specific dynamics learning experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
experiments = [
  "torch==2.8.0", "numpy==1.26.4", "scipy==1.15.3", "pandas==2.3.1",
  "sympy==1.13.3", "scikit-learn==1.3.2", "matplotlib==3.10.0",
  "tqdm==4.67.1", "higher==0.2.1",
]
symbolic = ["pysr==1.5.9"]
dev = ["ruff==0.14.3", "pytest==8.4.2", "build==1.3.0"]

[project.scripts]
dssdl = "dssdl.cli:main"

[project.urls]
Repository = "https://github.com/PaoShou-China/DSSDL"
Documentation = "https://github.com/PaoShou-China/DSSDL/blob/main/GETTING_STARTED.md"
Issues = "https://github.com/PaoShou-China/DSSDL/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["**/outputs/**", "**/cavia-master/**", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Original plotting helpers are retained as historical reference; use the CLI.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
